# Google Cloud Build Pipeline for Quirk & Quanta
# Project: momence-support-agent | Region: asia-south1 | Service: quirk-quanta-rag

steps:
  # 1. Build container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/quirk-quanta-rag:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/quirk-quanta-rag:latest'
      - '-f'
      - 'deploy/Dockerfile'
      - '.'

  # 2. Push container image to GCR / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/quirk-quanta-rag:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/quirk-quanta-rag:latest'

  # 3. Deploy to Cloud Run (asia-south1)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'quirk-quanta-rag'
      - '--image'
      - 'gcr.io/$PROJECT_ID/quirk-quanta-rag:$COMMIT_SHA'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '1'
      - '--concurrency'
      - '20'
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '3'
      - '--timeout'
      - '45s'

images:
  - 'gcr.io/$PROJECT_ID/quirk-quanta-rag:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/quirk-quanta-rag:latest'

options:
  logging: CLOUD_LOGGING_ONLY
